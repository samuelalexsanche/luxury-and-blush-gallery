<script>
(function(){
  var ph=Array.prototype.slice.call(document.querySelectorAll('.gp-ph'));
  ph.forEach(function(p){var im=p.querySelector('img');
    function ok(){im.classList.add('loaded');}
    if(im.complete&&im.naturalWidth>0)ok();else{im.addEventListener('load',ok);im.addEventListener('error',ok);}});
  var lb=document.getElementById('glb'),li=document.getElementById('glbImg'),idx=0;
  function L(){return ph.map(function(p){return p.querySelector('img');});}
  function open(i){var a=L();idx=i;li.src=a[idx].src;li.alt=a[idx].alt;lb.classList.add('open');document.body.style.overflow='hidden';}
  function close(){lb.classList.remove('open');document.body.style.overflow='';}
  function nav(d){var a=L();idx=(idx+d+a.length)%a.length;li.src=a[idx].src;li.alt=a[idx].alt;}
  ph.forEach(function(p,i){p.addEventListener('click',function(){open(i);});});
  document.getElementById('glbClose').addEventListener('click',close);
  document.getElementById('glbPrev').addEventListener('click',function(){nav(-1);});
  document.getElementById('glbNext').addEventListener('click',function(){nav(1);});
  lb.addEventListener('click',function(e){if(e.target===lb)close();});
  document.addEventListener('keydown',function(e){if(!lb.classList.contains('open'))return;if(e.key==='Escape')close();if(e.key==='ArrowLeft')nav(-1);if(e.key==='ArrowRight')nav(1);});
})();
</script>
