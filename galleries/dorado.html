<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Dorado — Wedding Gallery | Luxury and Blush Events</title>
<meta name="description" content="El Dorado — a real luxury wedding gallery by Luxury and Blush Events. México.">
<meta name="robots" content="index, follow, max-image-preview:large">
<link rel="canonical" href="https://samuelalexsanche.github.io/luxury-and-blush-gallery/galleries/dorado.html">
<meta property="og:type" content="article">
<meta property="og:title" content="El Dorado — Luxury and Blush Events">
<meta property="og:image" content="../images/g/dorado/01.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--cream:#FAF8F5;--warm:#F3EDE7;--blush:#E8DDD3;--dark:#1a1a1a;--text:#2c2c2c;--muted:#4a4643;--gold:#b8986e;--gold-light:#d4bc96;--white:#fff;--serif:'Cormorant Garamond',serif;--sans:'Montserrat',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--cream);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
.gnav{position:sticky;top:0;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:20px 48px;background:rgba(250,248,245,0.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--blush)}
.gnav a{text-decoration:none}
.gnav-logo{display:flex;align-items:center;gap:12px;font-family:var(--serif);font-size:18px;letter-spacing:3px;text-transform:uppercase;color:var(--dark)}
.gnav-logo img{height:30px;width:auto}
.gback{font-family:var(--sans);font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);transition:color .3s}
.gback:hover{color:var(--gold)}
.ghead{text-align:center;padding:80px 24px 48px}
.ghead .tag{font-family:var(--sans);font-size:12px;letter-spacing:6px;text-transform:uppercase;color:#8b7355;font-weight:600;margin-bottom:18px}
.ghead h1{font-family:var(--serif);font-weight:300;font-size:clamp(42px,6vw,72px);line-height:1.05;color:var(--dark)}
.ghead h1 em{font-style:italic;color:var(--gold)}
.ghead .meta{font-family:var(--sans);font-size:11px;letter-spacing:4px;text-transform:uppercase;color:var(--muted);margin-top:20px}
.gmasonry{display:flex;gap:12px;max-width:1300px;margin:0 auto;padding:0 40px 100px;align-items:flex-start}
.gcol{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
.gphoto{position:relative;overflow:hidden;cursor:pointer;background:var(--dark);display:block}
.gphoto img{width:100%;height:auto;display:block;opacity:0;transition:opacity .8s ease,transform .8s cubic-bezier(.16,1,.3,1)}
.gphoto img.loaded{opacity:1}
.gphoto:hover img{transform:scale(1.04)}
.gfoot{text-align:center;padding:60px 24px;border-top:1px solid var(--blush)}
.gfoot a{font-family:var(--sans);font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);text-decoration:none}
.gfoot a:hover{color:var(--gold)}
.glb{position:fixed;inset:0;z-index:1000;background:rgba(18,17,16,.94);display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:opacity .4s}
.glb.open{opacity:1;visibility:visible}
.glb img{max-width:90vw;max-height:88vh;object-fit:contain;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.glb-btn{position:absolute;background:none;border:none;color:rgba(255,255,255,.7);cursor:pointer;font-family:var(--serif);font-size:44px;line-height:1;transition:color .3s;user-select:none}
.glb-btn:hover{color:#fff}
.glb-close{top:24px;right:34px;font-size:34px}
.glb-prev{left:24px;top:50%;transform:translateY(-50%)}
.glb-next{right:24px;top:50%;transform:translateY(-50%)}
@media(max-width:980px){.gmasonry{padding:0 20px 70px;gap:8px}.gcol{gap:8px}.gnav{padding:16px 24px}}
@media(prefers-reduced-motion:reduce){.gphoto img{opacity:1!important}}
</style>
</head>
<body>
<nav class="gnav">
  <a class="gnav-logo" href="../index.html"><img src="https://luxuryandblush.com/luxury-and-blush/images/logos/logo-lb.png" alt="Luxury and Blush Events">Luxury and Blush</a>
  <a class="gback" href="../index.html#gallery">← <span>The Gallery</span></a>
</nav>
<header class="ghead">
  <div class="tag">Real Wedding · Luxury and Blush</div>
  <h1>El <em>Dorado</em></h1>
  <div class="meta">México</div>
</header>
<div class="gmasonry" id="gm">
  <figure class="gphoto"><img src="../images/g/dorado/01.webp" alt="El Dorado luxury wedding by Luxury and Blush Events" loading="lazy"></figure>
  <figure class="gphoto"><img src="../images/g/dorado/02.webp" alt="El Dorado luxury wedding by Luxury and Blush Events" loading="lazy"></figure>
  <figure class="gphoto"><img src="../images/g/dorado/03.webp" alt="El Dorado luxury wedding by Luxury and Blush Events" loading="lazy"></figure>
  <figure class="gphoto"><img src="../images/g/dorado/04.webp" alt="El Dorado luxury wedding by Luxury and Blush Events" loading="lazy"></figure>
  <figure class="gphoto"><img src="../images/g/dorado/05.webp" alt="El Dorado luxury wedding by Luxury and Blush Events" loading="lazy"></figure>
</div>
<footer class="gfoot">
  <a href="../index.html#gallery">← Back to The Collection</a>
</footer>
<div class="glb" id="glb">
  <button class="glb-btn glb-close" id="glbClose" aria-label="Close">×</button>
  <button class="glb-btn glb-prev" id="glbPrev" aria-label="Previous">‹</button>
  <img id="glbImg" src="" alt="">
  <button class="glb-btn glb-next" id="glbNext" aria-label="Next">›</button>
</div>
<script>
(function(){
  var gm=document.getElementById('gm');
  var all=Array.prototype.slice.call(gm.querySelectorAll('.gphoto'));
  function ncols(){return window.innerWidth<=980?2:3;}
  function layout(){
    var n=ncols(),cols=[];for(var i=0;i<n;i++){var c=document.createElement('div');c.className='gcol';cols.push(c);}
    all.forEach(function(it,i){cols[i%n].appendChild(it);});
    gm.textContent='';cols.forEach(function(c){gm.appendChild(c);});
  }
  var rt;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){if(gm.children.length!==ncols())layout();},160);});
  layout();
  // fade-in on load
  all.forEach(function(p){var im=p.querySelector('img');if(im.complete&&im.naturalWidth>0){im.classList.add('loaded');}else{im.addEventListener('load',function(){im.classList.add('loaded');});im.addEventListener('error',function(){im.classList.add('loaded');});}});
  // lightbox
  var lb=document.getElementById('glb'),li=document.getElementById('glbImg'),idx=0;
  function list(){return all.map(function(p){return p.querySelector('img');});}
  function open(i){var L=list();idx=i;li.src=L[idx].src;li.alt=L[idx].alt;lb.classList.add('open');document.body.style.overflow='hidden';}
  function close(){lb.classList.remove('open');document.body.style.overflow='';}
  function nav(d){var L=list();idx=(idx+d+L.length)%L.length;li.src=L[idx].src;li.alt=L[idx].alt;}
  all.forEach(function(p,i){p.addEventListener('click',function(){open(all.indexOf(p));});});
  document.getElementById('glbClose').addEventListener('click',close);
  document.getElementById('glbPrev').addEventListener('click',function(){nav(-1);});
  document.getElementById('glbNext').addEventListener('click',function(){nav(1);});
  lb.addEventListener('click',function(e){if(e.target===lb)close();});
  document.addEventListener('keydown',function(e){if(!lb.classList.contains('open'))return;if(e.key==='Escape')close();if(e.key==='ArrowLeft')nav(-1);if(e.key==='ArrowRight')nav(1);});
})();
</script>
</body>
</html>
